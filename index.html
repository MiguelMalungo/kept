<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Serenity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..700;1,8..60,200..700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Three.js only ships as an ES module, and the .jsx files below are
       classic Babel-transpiled scripts that cannot use import. The promise is
       created synchronously here and resolved by the module script, so the
       hero particles can await it regardless of which executes first. -->
  <script>
    window.__threeReady = new Promise((resolve) => { window.__resolveThree = resolve; });
  </script>
  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
    window.THREE = THREE;
    window.__resolveThree(THREE);
  </script>

  <script src="poems.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="ambient.jsx"></script>
  <script type="text/babel" src="mixer.jsx"></script>
  <script type="text/babel" src="particles.jsx"></script>
  <script type="text/babel" src="hero.jsx"></script>
  <script type="text/babel" src="gallery.jsx"></script>
  <script type="text/babel" src="modal.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
